services:
  api:
    build: .
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-60}
      PADDLE_TEXT_DETECTION_MODEL: ${PADDLE_TEXT_DETECTION_MODEL:-PP-OCRv5_mobile_det}
      PADDLE_TEXT_RECOGNITION_MODEL: ${PADDLE_TEXT_RECOGNITION_MODEL:-arabic_PP-OCRv5_mobile_rec}
      PADDLE_PDX_CACHE_HOME: /home/appuser/.paddlex
    volumes:
      - paddle_models:/home/appuser/.paddlex
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - ai_internal

networks:
  ai_internal:
    external: true
    name: ai_internal

volumes:
  paddle_models:
