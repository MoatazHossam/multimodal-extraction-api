services:
  api:
    build: .
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - ai_internal

networks:
  ai_internal:
    external: true
    name: ai_internal
